<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trading Checklist</title>
<link rel="manifest" href="manifest-checklist.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1318;--panel:#1a1f27;--line:#2a2f3a;--text:#e4e4e7;--muted:#71717a;--accent:#3b82f6;--green:#22c55e;--red:#ef4444}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);min-height:100vh}
h1{font-size:20px;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.section-head{padding:10px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.section-head .count{font-size:12px;color:var(--muted);font-weight:400}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4;cursor:pointer;-webkit-tap-highlight-color:transparent}
.item:last-child{border-bottom:none}
.item:active{background:rgba(255,255,255,.03)}
.item.done{color:var(--muted);text-decoration:line-through}
.item input[type=checkbox]{margin-top:2px;min-width:18px;min-height:18px;accent-color:var(--green)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:12px 14px}
.notes h2{font-size:14px;margin-bottom:8px}
.notes li{font-size:13px;margin-bottom:6px;line-height:1.4;color:var(--muted)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn:active{opacity:.7}
.btn.green{background:var(--green);color:#000;border-color:var(--green)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.progress{height:4px;background:var(--line);border-radius:4px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--green);transition:width .3s}
.frozen{background:rgba(59,130,246,.12);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.item-wrap{border-bottom:1px solid var(--line)}
.item-wrap:last-child{border-bottom:none}
.item-wrap .item{border-bottom:none;padding-bottom:4px}
.item-wrap.done .item{color:var(--muted);text-decoration:line-through}
.item-note{display:block;width:calc(100% - 42px);margin:0 14px 10px 42px;padding:7px 9px;font:inherit;font-size:13px;line-height:1.4;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;resize:none;overflow:hidden;min-height:38px}
.item-note:focus{outline:none;border-color:var(--accent)}
.item-note::placeholder{color:var(--muted)}
.item-wrap.done .item-note{text-decoration:none;color:var(--text)}
</style>
</head>
<body>
<h1>✅ <span id="cl-name">Trading Checklist</span></h1>
<div class="bar">
  <button class="btn green" id="reset">Reset all</button>
  <button class="btn" id="freeze">📌 Figer (entrée)</button>
  <button class="btn" id="back" onclick="window.close()">Close</button>
</div>
<div class="frozen" id="frozen" hidden></div>
<div class="progress"><div class="progress-fill" id="pbar"></div></div>
<div id="app"><div class="empty">Loading trading plan...</div></div>

<script>
(function() {
  'use strict';
  // This page lives in /journal-trading/ or /journal-backtest/: read THAT journal first
  // (both journals share the browser storage of lebabou.github.io).
  var APP = /journal-trading/.test(location.pathname) ? 'journal-trading' : 'journal-backtest';
  var OTHER = APP === 'journal-trading' ? 'journal-backtest' : 'journal-trading';
  var CACHE_KEYS = ['drive_cache_' + APP + '.json', 'drive_cache_' + OTHER + '.json'];
  var plan = null;

  function activeOf(db) {
    if (!db) return null;
    if (db.tradingPlans && db.tradingPlans.length) {
      var act = db.tradingPlans.filter(function(p) { return p.id === db.activePlanId; })[0] || db.tradingPlans[0];
      if (act && act.sections && act.sections.length) return act;
    }
    if (db.tradingPlan && db.tradingPlan.sections && db.tradingPlan.sections.length) return db.tradingPlan;
    return null;
  }
  function loadPlan() {
    for (var i = 0; i < CACHE_KEYS.length; i++) {
      try { var p = activeOf(JSON.parse(localStorage.getItem(CACHE_KEYS[i]))); if (p) return p; } catch (e) {}
    }
    return null;
  }
  function loadPlanAsync(cb) {
    var p = loadPlan();
    if (p) return cb(p);
    fetch('journal.json').then(function(r) { return r.json(); }).then(function(db) { cb(activeOf(db)); }).catch(function() { cb(null); });
  }

  // Ticks and notes are kept per journal AND per plan, so two plans (or two journals) never mix
  function stateKey() { return 'checklist_v2:' + APP + ':' + ((plan && (plan.id || plan.name)) || 'default'); }
  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(stateKey()));
      if (s && s.checks && s.notes) return s;
    } catch (e) {}
    return { checks: {}, notes: {} };
  }
  function saveState(s) { try { localStorage.setItem(stateKey(), JSON.stringify(s)); } catch (e) {} }

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(38, ta.scrollHeight) + 'px'; }

  // Built ONCE; ticking or typing only updates what changed (no rebuild, so a note being typed is never lost)
  function render() {
    if (!plan) plan = loadPlan();
    if (!plan) {
      document.getElementById('app').innerHTML = '<div class="empty">No trading plan found.<br><br>Open your journal app first, go to the Trading Plan tab, and make sure you have sections saved. Then come back here.</div>';
      return;
    }
    var st = loadState(), html = '';
    plan.sections.forEach(function(sec, si) {
      var items = '';
      sec.items.forEach(function(item, ii) {
        var key = si + '-' + ii, checked = !!st.checks[key], note = st.notes[key] || '';
        items += '<div class="item-wrap' + (checked ? ' done' : '') + '" data-key="' + key + '" data-sec="' + si + '">' +
          '<label class="item"><input type="checkbox" data-key="' + key + '"' + (checked ? ' checked' : '') + '>' +
          '<span>' + esc(item) + '</span></label>' +
          '<textarea class="item-note" data-key="' + key + '" rows="1" placeholder="Note pour ce point\u2026">' + esc(note) + '</textarea>' +
          '</div>';
      });
      html += '<div class="section"><div class="section-head">' + esc(sec.title) +
        '<span class="count" data-sec="' + si + '"></span></div>' + items + '</div>';
    });
    if (plan.notes && plan.notes.length) {
      html += '<div class="notes"><h2>\ud83d\udcdd Trading Notes</h2><ul>';
      plan.notes.forEach(function(n) { html += '<li>' + esc(n) + '</li>'; });
      html += '</ul></div>';
    }
    document.getElementById('app').innerHTML = html;
    if (plan.name) document.getElementById('cl-name').textContent = plan.name;
    refreshCounts();

    Array.prototype.forEach.call(document.querySelectorAll('input[type=checkbox][data-key]'), function(cb) {
      cb.onchange = function() {
        var s = loadState();
        if (cb.checked) s.checks[cb.dataset.key] = true; else delete s.checks[cb.dataset.key];
        saveState(s);
        cb.closest('.item-wrap').classList.toggle('done', cb.checked);
        refreshCounts();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('textarea.item-note'), function(ta) {
      grow(ta);
      var t = null;
      ta.oninput = function() {
        grow(ta);
        clearTimeout(t);
        t = setTimeout(function() {
          var s = loadState(), v = ta.value;
          if (v.trim()) s.notes[ta.dataset.key] = v; else delete s.notes[ta.dataset.key];
          saveState(s);
        }, 250);
      };
      ta.onblur = function() { ta.oninput(); };
    });
  }

  function refreshCounts() {
    var total = 0, done = 0;
    plan.sections.forEach(function(sec, si) {
      var n = sec.items.length, d = document.querySelectorAll('.item-wrap.done[data-sec="' + si + '"]').length;
      total += n; done += d;
      var c = document.querySelector('.count[data-sec="' + si + '"]');
      if (c) c.textContent = d + '/' + n;
    });
    document.getElementById('pbar').style.width = (total ? (done / total * 100) : 0) + '%';
  }

  document.getElementById('reset').onclick = function() {
    if (confirm('Effacer toutes les coches et toutes les notes de cette checklist (nouveau trade) ?')) {
      saveState({ checks: {}, notes: {} });
      render();
    }
  };


  // Freeze: a timestamped copy of ticks + notes, attached to the next trade saved in the journal
  var SNAP_KEY = 'checklist_frozen_v1:' + APP;
  function pad(n) { return ('0' + n).slice(-2); }
  function showFrozen() {
    var el = document.getElementById('frozen'), s = null;
    try { s = JSON.parse(localStorage.getItem(SNAP_KEY)); } catch (e) {}
    var d = new Date(), today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    if (s && s.date === today) {
      el.hidden = false;
      el.textContent = s.used ? '\u2705 Checklist fig\u00e9e \u00e0 ' + s.time + ' jointe au trade #' + s.used + '.' : '\ud83d\udccc Checklist fig\u00e9e \u00e0 ' + s.time + ' (' + s.done + '/' + s.total + ') : elle sera jointe au prochain trade enregistr\u00e9 aujourd\u2019hui.';
    } else el.hidden = true;
  }
  document.getElementById('freeze').onclick = function() {
    if (!plan) return;
    var st = loadState(), items = [], done = 0;
    plan.sections.forEach(function(sec, si) {
      sec.items.forEach(function(item, ii) {
        var k = si + '-' + ii, ok = !!st.checks[k];
        if (ok) done++;
        items.push({ section: sec.title, text: item, done: ok, note: st.notes[k] || '' });
      });
    });
    var d = new Date();
    var snap = { at: d.toISOString(), date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      planId: plan.id || '', planName: plan.name || '', done: done, total: items.length, items: items };
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(snap)); } catch (e) {}
    showFrozen();
  };
  showFrozen();
  loadPlanAsync(function(p) { plan = p; render(); });
})();
</script>
</body>
</html>
